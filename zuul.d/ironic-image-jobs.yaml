---
- job:
    name: ironic-build-partition-image
    parent: publish-openstack-artifacts
    description: |
      Periodically build and publish Ironic's Debian Trixie root-partition
      image fixture, including its removable UEFI GRUB assets, kernel, initrd,
      and SHA256 checksums. CI consumer jobs use these published artifacts to
      test partition-image deployment and local UEFI boot.
    timeout: 3600
    run: playbooks/ci/build-partition-image.yaml
    required-projects:
      - opendev.org/openstack/diskimage-builder
      - opendev.org/openstack/requirements

- job:
    name: ironic-check-build-partition-image
    parent: base
    description: |
      Build Ironic's Debian Trixie root-partition image fixture, including its
      removable UEFI GRUB assets, without publishing artifacts. This check
      validates the DIB recipe when image-building files change.
    timeout: 3600
    run: playbooks/ci/build-partition-image.yaml
    required-projects:
      - opendev.org/openstack/diskimage-builder
      - opendev.org/openstack/requirements
