---
security:
  - |
    Versioned notifications no longer publish volume target ``properties``,
    which can hold iSCSI/FC credentials, or the ``actions`` and
    ``conditions`` of inspection rules flagged ``sensitive``. Masking
    previously covered node notifications only. See `bug 2166500
    <https://bugs.launchpad.net/ironic/+bug/2166500>`_.
upgrade:
  - |
    Those fields now hold a ``redacted_contents`` placeholder in
    ``baremetal.volumetarget.*`` and ``baremetal.inspectionrule.*``
    notifications. Read them from the REST API instead.
